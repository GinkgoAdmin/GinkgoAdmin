      <g transform="translate(20 110)">
        <text class="font" font-size="20" font-weight="700" fill="#d97706">¥ 8,880</text>
        <g transform="translate(232 -18)">
          <rect width="128" height="32" rx="6" fill="#f0fdf4" stroke="#10b981"/>
          <text x="64" y="20" text-anchor="middle" class="font" font-size="12" font-weight="600" fill="#059669">🛒 购买</text>
        </g>
      </g>
