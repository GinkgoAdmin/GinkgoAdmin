  <!-- ================= 右下角：成功 Toast ================= -->
  <g transform="translate(1108 720)" filter="url(#fx-dialog)">
    <rect width="440" height="160" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <!-- 左侧色条 -->
    <rect width="6" height="160" rx="3" fill="url(#lg-success)"/>

    <g transform="translate(32 28)">
      <circle cx="14" cy="14" r="14" fill="url(#lg-success)"/>
      <path d="M9 14 L12 17 L19 11" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="72" y="42" class="font" font-size="14" font-weight="700" fill="#065f46">前端插件能力已刷新</text>
    <text x="72" y="62" class="font" font-size="12" fill="#6b7280">AICore 企业版已热加载完成，新菜单已可用：</text>
    <g transform="translate(72 78)">
      <rect width="96" height="22" rx="11" fill="#d1fae5"/>
      <text x="48" y="15" text-anchor="middle" class="font" font-size="11" fill="#065f46">AI 对话</text>
    </g>
    <g transform="translate(176 78)">
      <rect width="108" height="22" rx="11" fill="#d1fae5"/>
      <text x="54" y="15" text-anchor="middle" class="font" font-size="11" fill="#065f46">能力广场</text>
    </g>
    <g transform="translate(292 78)">
      <rect width="108" height="22" rx="11" fill="#d1fae5"/>
      <text x="54" y="15" text-anchor="middle" class="font" font-size="11" fill="#065f46">审批记录</text>
    </g>
    <g transform="translate(72 110)">
      <rect width="148" height="22" rx="11" fill="#fef3c7"/>
      <text x="74" y="15" text-anchor="middle" class="font" font-size="11" fill="#92400e">💡 请重启后端服务</text>
    </g>

    <text x="416" y="28" text-anchor="end" class="font" font-size="16" fill="#94a3b8">×</text>
  </g>
</svg>
