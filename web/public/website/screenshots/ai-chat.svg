<?xml version="1.0" encoding="UTF-8"?>
<!--
  GinkgoAdmin 首页 - AI 对话界面样张（重做版 · 宽松布局）
  复刻 web/src/plugins/installed/aicore/components/AIChatButton.vue：
  顶栏（标题 + 模型 + 关闭）/ 左会话列表 / 右消息区（气泡） / 底部输入区
  全画布 1600×1000，文字与控件保持充裕的留白与行距。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="GinkgoAdmin AI 智能助手">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="lg-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="lg-user" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="lg-send" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="fx-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style>.font{font-family:'Microsoft YaHei','PingFang SC','Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}</style>

  <!-- 背景 -->
  <rect width="1600" height="1000" fill="url(#lg-bg)"/>

  <!-- ============= 顶栏 ============= -->
  <rect x="0" y="0" width="1600" height="80" fill="url(#lg-header)"/>
  <!-- 左侧菜单图标 + 标题 -->
  <g transform="translate(28 28)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="0" y1="2" x2="22" y2="2"/>
    <line x1="0" y1="12" x2="22" y2="12"/>
    <line x1="0" y1="22" x2="22" y2="22"/>
  </g>
  <g transform="translate(72 30)">
    <circle cx="14" cy="14" r="14" fill="#ffffff" opacity="0.2"/>
    <text x="14" y="20" text-anchor="middle" class="font" font-size="16" font-weight="700" fill="#ffffff">AI</text>
  </g>
  <text x="116" y="50" class="font" font-size="20" font-weight="700" fill="#ffffff">AI 智能助手</text>
  <text x="234" y="50" class="font" font-size="14" fill="#e9d5ff">· 由 DeepSeek v3.1 提供能力</text>

  <!-- 顶栏右侧操作 -->
  <g transform="translate(1340 22)">
    <rect width="120" height="36" rx="18" fill="rgba(255,255,255,0.18)"/>
    <circle cx="22" cy="18" r="6" fill="#34d399"/>
    <text x="40" y="23" class="font" font-size="13" font-weight="600" fill="#ffffff">已连接</text>
  </g>
  <g transform="translate(1480 22)" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round">
    <rect width="36" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="none"/>
    <path d="M12 14 v8 m0 4 h0" transform="translate(6 6)" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g transform="translate(1530 22)" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none">
    <rect width="36" height="36" rx="18" fill="rgba(255,255,255,0.12)" stroke="none"/>
    <line x1="12" y1="12" x2="24" y2="24"/>
    <line x1="24" y1="12" x2="12" y2="24"/>
  </g>

  <!-- ============= 左侧会话列表 ============= -->
  <rect x="0" y="80" width="400" height="860" fill="#ffffff"/>
  <line x1="400" y1="80" x2="400" y2="940" stroke="#e5e7eb"/>

  <!-- 新会话按钮 -->
  <g transform="translate(24 104)">
    <rect width="352" height="48" rx="10" fill="url(#lg-user)" filter="url(#fx-card)"/>
    <g transform="translate(28 24)" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round">
      <line x1="-7" y1="0" x2="7" y2="0"/><line x1="0" y1="-7" x2="0" y2="7"/>
    </g>
    <text x="60" y="30" class="font" font-size="15" font-weight="600" fill="#ffffff">新建对话</text>
  </g>

  <!-- 搜索框 -->
  <g transform="translate(24 168)">
    <rect width="352" height="40" rx="20" fill="#f3f4f6"/>
    <g transform="translate(20 20)" stroke="#9ca3af" stroke-width="1.8" fill="none">
      <circle cx="0" cy="0" r="6"/><line x1="5" y1="5" x2="9" y2="9" stroke-linecap="round"/>
    </g>
    <text x="40" y="25" class="font" font-size="13" fill="#9ca3af">搜索历史会话…</text>
  </g>

  <!-- 会话分组标题 -->
  <text x="24" y="240" class="font" font-size="12" font-weight="600" fill="#9ca3af" letter-spacing="1">最近 7 天</text>

  <!-- 会话列表项 -->
  <!-- 会话 1 - 当前选中 -->
  <g transform="translate(16 256)">
    <rect width="368" height="76" rx="10" fill="#f5f3ff" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="4" height="76" rx="2" fill="#7c3aed"/>
    <text x="20" y="28" class="font" font-size="14" font-weight="600" fill="#1f2937">帮我分析这个订单的异常</text>
    <text x="20" y="52" class="font" font-size="12" fill="#6b7280">已调用 2 个工具，正在分析支付状态…</text>
    <text x="20" y="68" class="font" font-size="11" fill="#a855f7">刚刚 · 8 条消息</text>
    <g transform="translate(338 14)" stroke="#9ca3af" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M0 0 L10 -2 L8 6 L4 4 Z" fill="#fbbf24" stroke="none"/>
    </g>
  </g>

  <!-- 会话 2 -->
  <g transform="translate(16 348)">
    <rect width="368" height="68" rx="10" fill="transparent"/>
    <text x="20" y="28" class="font" font-size="14" fill="#374151">新建一个 CRM 客户字段</text>
    <text x="20" y="50" class="font" font-size="12" fill="#9ca3af">已完成 · 12 条消息</text>
    <text x="320" y="28" class="font" font-size="11" fill="#9ca3af">2 小时前</text>
  </g>

  <!-- 会话 3 -->
  <g transform="translate(16 432)">
    <rect width="368" height="68" rx="10" fill="transparent"/>
    <text x="20" y="28" class="font" font-size="14" fill="#374151">生成本月销售业绩报告</text>
    <text x="20" y="50" class="font" font-size="12" fill="#9ca3af">已完成 · 6 条消息</text>
    <text x="320" y="28" class="font" font-size="11" fill="#9ca3af">昨天</text>
  </g>

  <!-- 会话 4 -->
  <g transform="translate(16 516)">
    <rect width="368" height="68" rx="10" fill="transparent"/>
    <text x="20" y="28" class="font" font-size="14" fill="#374151">批量更新用户所属部门</text>
    <text x="20" y="50" class="font" font-size="12" fill="#9ca3af">⚠ 等待审批 · 3 条消息</text>
    <text x="320" y="28" class="font" font-size="11" fill="#9ca3af">2 天前</text>
  </g>

  <!-- 分组标题 - 更早 -->
  <text x="24" y="624" class="font" font-size="12" font-weight="600" fill="#9ca3af" letter-spacing="1">更早</text>

  <!-- 会话 5 -->
  <g transform="translate(16 640)">
    <rect width="368" height="68" rx="10" fill="transparent"/>
    <text x="20" y="28" class="font" font-size="14" fill="#374151">帮我写一个数据导出脚本</text>
    <text x="20" y="50" class="font" font-size="12" fill="#9ca3af">已完成 · 4 条消息</text>
    <text x="320" y="28" class="font" font-size="11" fill="#9ca3af">5 天前</text>
  </g>

  <!-- 会话 6 -->
  <g transform="translate(16 724)">
    <rect width="368" height="68" rx="10" fill="transparent"/>
    <text x="20" y="28" class="font" font-size="14" fill="#374151">权限策略设计建议</text>
    <text x="20" y="50" class="font" font-size="12" fill="#9ca3af">已完成 · 9 条消息</text>
    <text x="320" y="28" class="font" font-size="11" fill="#9ca3af">上周</text>
  </g>

  <!-- ============= 右侧消息区 ============= -->
  <rect x="400" y="80" width="1200" height="780" fill="#ffffff"/>

  <!-- 消息：用户提问 1 -->
  <g transform="translate(960 110)">
    <rect width="600" height="56" rx="14" fill="url(#lg-user)" filter="url(#fx-card)"/>
    <text x="30" y="35" class="font" font-size="15" fill="#ffffff">帮我分析最近订单 ORD-20260430-8821 的异常情况，并给出处理建议。</text>
  </g>
  <g transform="translate(1572 116)">
    <circle cx="0" cy="20" r="20" fill="#a855f7"/>
    <text x="0" y="26" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#ffffff">张</text>
  </g>

  <!-- 消息：AI 回答 1（含步骤追踪 + 报告 + 代码块） -->
  <g transform="translate(440 196)">
    <circle cx="0" cy="20" r="20" fill="#7c3aed"/>
    <text x="0" y="26" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#ffffff">AI</text>
  </g>

  <!-- AI 气泡 1 -->
  <g transform="translate(480 196)">
    <rect width="940" height="436" rx="14" fill="#f9fafb" stroke="#e5e7eb" filter="url(#fx-card)"/>

    <!-- 工具调用过程追踪 -->
    <g transform="translate(24 24)">
      <rect width="892" height="36" rx="8" fill="#ede9fe"/>
      <g transform="translate(16 18)" fill="#7c3aed">
        <circle r="4"/>
      </g>
      <text x="32" y="23" class="font" font-size="13" font-weight="600" fill="#5b21b6">已完成 2 个工具调用</text>
      <text x="220" y="23" class="font" font-size="12" fill="#7c3aed">queryOrder · listPaymentRecords</text>
      <g transform="translate(848 12)" stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M0 0 L6 6 L12 0" />
      </g>
    </g>

    <!-- 报告标题 -->
    <text x="24" y="92" class="font" font-size="16" font-weight="700" fill="#111827">订单异常分析报告</text>

    <!-- 报告 bullet -->
    <g transform="translate(24 108)" class="font" font-size="14" fill="#374151">
      <g transform="translate(0 16)">
        <circle cx="6" cy="-4" r="3" fill="#a855f7"/>
        <text x="20" y="0">订单金额：</text>
        <text x="100" y="0" font-weight="600" fill="#111827">¥2,890</text>
        <text x="160" y="0" fill="#6b7280">（实际到账 ¥2,890，差额 ¥0）</text>
      </g>
      <g transform="translate(0 44)">
        <circle cx="6" cy="-4" r="3" fill="#a855f7"/>
        <text x="20" y="0">支付通道：</text>
        <text x="100" y="0" font-weight="600" fill="#111827">微信支付</text>
        <text x="180" y="0" fill="#6b7280">· 状态正常 · 已结算</text>
      </g>
      <g transform="translate(0 72)">
        <circle cx="6" cy="-4" r="3" fill="#a855f7"/>
        <text x="20" y="0">异常点：</text>
        <text x="100" y="0" font-weight="600" fill="#dc2626">物流签收时间晚于平均 SLA 12 小时</text>
      </g>
      <g transform="translate(0 100)">
        <circle cx="6" cy="-4" r="3" fill="#a855f7"/>
        <text x="20" y="0">风险评分：</text>
        <text x="100" y="0" font-weight="600" fill="#f59e0b">中等（72/100）</text>
      </g>
    </g>

    <!-- SQL 代码块 -->
    <g transform="translate(24 252)">
      <rect width="892" height="120" rx="8" fill="#0f172a"/>
      <text x="20" y="28" class="font" font-size="11" fill="#94a3b8">📋 已执行 SQL（来自工具调用 queryOrder）</text>
      <text x="20" y="58" class="mono" font-size="13" fill="#e0e7ff">SELECT id, amount, status, created_at, channel</text>
      <text x="20" y="80" class="mono" font-size="13" fill="#e0e7ff">FROM order_main WHERE order_no = 'ORD-20260430-8821';</text>
      <text x="20" y="104" class="mono" font-size="11" fill="#64748b">-- 1 行返回 · 耗时 23ms · 通过审计 ✓</text>
    </g>

    <!-- 操作按钮 -->
    <g transform="translate(24 388)">
      <g><rect width="120" height="34" rx="17" fill="#ffffff" stroke="#a855f7"/>
        <text x="60" y="22" text-anchor="middle" class="font" font-size="13" font-weight="600" fill="#7c3aed">查看完整报告</text>
      </g>
      <g transform="translate(132 0)"><rect width="100" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
        <text x="50" y="22" text-anchor="middle" class="font" font-size="13" fill="#475569">复制内容</text>
      </g>
      <g transform="translate(244 0)"><rect width="100" height="34" rx="17" fill="#ffffff" stroke="#d1d5db"/>
        <text x="50" y="22" text-anchor="middle" class="font" font-size="13" fill="#475569">导出 PDF</text>
      </g>
      <text x="368" y="22" class="font" font-size="12" fill="#9ca3af">· 模型推理用时 1.4s</text>
    </g>
  </g>

  <!-- 消息：用户追问 -->
  <g transform="translate(960 660)">
    <rect width="600" height="48" rx="14" fill="url(#lg-user)" filter="url(#fx-card)"/>
    <text x="30" y="30" class="font" font-size="15" fill="#ffffff">那帮我针对该客户的后续订单加强风控等级。</text>
  </g>
  <g transform="translate(1572 666)">
    <circle cx="0" cy="20" r="20" fill="#a855f7"/>
    <text x="0" y="26" text-anchor="middle" class="font" font-size="13" font-weight="700" fill="#ffffff">张</text>
  </g>

  <!-- AI 思考中提示 -->
  <g transform="translate(440 736)">
    <circle cx="0" cy="20" r="20" fill="#7c3aed"/>
    <text x="0" y="26" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#ffffff">AI</text>
  </g>
  <g transform="translate(480 736)">
    <rect width="280" height="40" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <circle cx="24" cy="20" r="3" fill="#a855f7" opacity="0.4"/>
    <circle cx="36" cy="20" r="3" fill="#a855f7" opacity="0.7"/>
    <circle cx="48" cy="20" r="3" fill="#a855f7"/>
    <text x="68" y="25" class="font" font-size="13" fill="#6b7280">正在准备调用 updateCustomerRiskLevel…</text>
  </g>

  <!-- ============= 底部输入区 ============= -->
  <rect x="400" y="860" width="1200" height="80" fill="#fafaf9"/>
  <line x1="400" y1="860" x2="1600" y2="860" stroke="#e5e7eb"/>

  <!-- 模型选择 -->
  <g transform="translate(424 872)">
    <rect width="180" height="28" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="14" cy="14" r="4" fill="#10b981"/>
    <text x="26" y="19" class="font" font-size="12" font-weight="600" fill="#374151">DeepSeek Chat</text>
    <text x="118" y="19" class="font" font-size="11" fill="#9ca3af">v3.1</text>
    <path d="M158 12 L164 18 L170 12" stroke="#9ca3af" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(616 872)">
    <rect width="80" height="28" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="40" y="19" text-anchor="middle" class="font" font-size="12" fill="#475569">📎 附件</text>
  </g>
  <g transform="translate(704 872)">
    <rect width="100" height="28" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="50" y="19" text-anchor="middle" class="font" font-size="12" fill="#475569">🛠 工具集</text>
  </g>

  <!-- 输入框 -->
  <g transform="translate(424 904)">
    <rect width="1080" height="36" rx="18" fill="#ffffff" stroke="#d1d5db"/>
    <text x="20" y="23" class="font" font-size="13" fill="#9ca3af">请补一下这个订单的风控建议… （输入 / 唤起命令，Ctrl+Enter 发送）</text>
  </g>

  <!-- 发送按钮 -->
  <g transform="translate(1516 904)">
    <rect width="84" height="36" rx="18" fill="url(#lg-send)"/>
    <g transform="translate(20 18)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M0 0 L10 0 M6 -4 L10 0 L6 4"/>
    </g>
    <text x="56" y="23" class="font" font-size="13" font-weight="600" fill="#ffffff">发送</text>
  </g>
</svg>
