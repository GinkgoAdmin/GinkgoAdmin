  <!-- 代码片段：展示移动端 API 调用 -->
  <g transform="translate(1020 480)" filter="url(#fx-card)">
    <rect width="500" height="320" rx="12" fill="#0f172a"/>
    <g transform="translate(20 20)">
      <circle r="5" cx="0" cy="0" fill="#fb7185"/>
      <circle r="5" cx="16" cy="0" fill="#fbbf24"/>
      <circle r="5" cx="32" cy="0" fill="#34d399"/>
      <text x="56" y="4" class="font" font-size="11" fill="#64748b">customer-list.vue · UniApp</text>
    </g>
    <g transform="translate(20 60)" class="mono" font-size="12">
      <text y="0" fill="#64748b">// 统一封装，自动注入 token</text>
      <text y="22"><tspan fill="#c084fc">import</tspan><tspan fill="#e2e8f0"> { crmApi } </tspan><tspan fill="#c084fc">from</tspan><tspan fill="#fbbf24"> './api/index'</tspan></text>
      <text y="44"><tspan fill="#c084fc">import</tspan><tspan fill="#e2e8f0"> { guardCrmPermission } </tspan><tspan fill="#c084fc">from</tspan></text>
      <text y="62"><tspan fill="#e2e8f0">  </tspan><tspan fill="#fbbf24">'./utils/guard'</tspan></text>
      <text y="92" fill="#64748b">// 拦截无权限用户</text>
      <text y="114"><tspan fill="#c084fc">if</tspan><tspan fill="#e2e8f0"> (!</tspan><tspan fill="#93c5fd">guardCrmPermission</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#fbbf24">'crm:customer'</tspan><tspan fill="#e2e8f0">)) </tspan></text>
      <text y="132"><tspan fill="#e2e8f0">  </tspan><tspan fill="#c084fc">return</tspan></text>
      <text y="162" fill="#64748b">// 调用业务接口（自动走鉴权链路）</text>
      <text y="184"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> result = </tspan><tspan fill="#c084fc">await</tspan><tspan fill="#e2e8f0"> crmApi.</tspan><tspan fill="#93c5fd">getCustomers</tspan><tspan fill="#e2e8f0">({</tspan></text>
