  <!-- ============ 右侧浮卡：特性说明 ============ -->
  <g transform="translate(1240 130)">
    <rect width="286" height="120" rx="14" fill="#ffffff" filter="url(#fx-card)"/>
    <g transform="translate(16 40)"><circle r="18" fill="rgba(16,185,129,0.12)"/><text y="6" text-anchor="middle" class="font" font-size="18">🔒</text></g>
    <text x="52" y="34" class="font" font-size="13" font-weight="700" fill="#0f172a">复用后端鉴权</text>
    <text x="52" y="56" class="font" font-size="11" fill="#64748b">Web 端 auth-token 与</text>
    <text x="52" y="74" class="font" font-size="11" fill="#64748b">UniApp access_token</text>
    <text x="52" y="92" class="font" font-size="11" fill="#64748b">统一由框架下发管理</text>
  </g>
  <g transform="translate(1240 270)">
    <rect width="286" height="120" rx="14" fill="#ffffff" filter="url(#fx-card)"/>
    <g transform="translate(16 40)"><circle r="18" fill="rgba(99,102,241,0.12)"/><text y="6" text-anchor="middle" class="font" font-size="18">🧩</text></g>
    <text x="52" y="34" class="font" font-size="13" font-weight="700" fill="#0f172a">插件页面即装即用</text>
    <text x="52" y="56" class="font" font-size="11" fill="#64748b">installed/*/pages 目录</text>
    <text x="52" y="74" class="font" font-size="11" fill="#64748b">下的页面通过系统统一</text>
    <text x="52" y="92" class="font" font-size="11" fill="#64748b">路由自动注册生效</text>
  </g>
  <g transform="translate(1240 410)">
    <rect width="286" height="120" rx="14" fill="#ffffff" filter="url(#fx-card)"/>
    <g transform="translate(16 40)"><circle r="18" fill="rgba(236,72,153,0.12)"/><text y="6" text-anchor="middle" class="font" font-size="18">📡</text></g>
    <text x="52" y="34" class="font" font-size="13" font-weight="700" fill="#0f172a">request.js 统一封装</text>
    <text x="52" y="56" class="font" font-size="11" fill="#64748b">get/post/put/del</text>
    <text x="52" y="74" class="font" font-size="11" fill="#64748b">自动注入 token、401</text>
    <text x="52" y="92" class="font" font-size="11" fill="#64748b">跳登录、错误统一提示</text>
  </g>
  <g transform="translate(1240 550)">
    <rect width="286" height="120" rx="14" fill="#ffffff" filter="url(#fx-card)"/>
    <g transform="translate(16 40)"><circle r="18" fill="rgba(245,158,11,0.14)"/><text y="6" text-anchor="middle" class="font" font-size="18">🎨</text></g>
    <text x="52" y="34" class="font" font-size="13" font-weight="700" fill="#0f172a">原生风格 TabBar</text>
    <text x="52" y="56" class="font" font-size="11" fill="#64748b">GkTabBar 组件在各端</text>
    <text x="52" y="74" class="font" font-size="11" fill="#64748b">自动适配 iOS / Android</text>
    <text x="52" y="92" class="font" font-size="11" fill="#64748b">安全区与指示条</text>
  </g>

  <!-- 左下统计 -->
  <g transform="translate(80 800)">
    <text class="font" font-size="11" fill="#94a3b8">与 Web / WPF 共用</text>
    <text y="26" class="font" font-size="16" font-weight="700" fill="#0f172a">同一套业务 API、同一套权限点</text>
    <text y="50" class="font" font-size="13" fill="#475569">改一次，三端同步生效</text>
